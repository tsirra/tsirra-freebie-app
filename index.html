const HELP={
dir:[`Write one sentence that tells someone three things:

* What you're making.
* Who it's for.
* What it helps that person do or solve.

Don't explain your whole business. You're simply describing your product so another person can understand it.

Your sentence:

I'm making a [product] for [specific person] who wants to [result or problem solved].`,
`You don't need to write a perfect sentence. Fill in these three blanks:

* It helps them: What do they want to achieve, or what problem do they want to solve?

Now combine your answers into one sentence.

If you can't fill in all three blanks, work on the missing part first.`,
`You don't have to make the perfect choice right now. You just need a clear enough description to move forward.

`Look at the three things this sentence needs:

`You don't need a long work session for this.

Today's goal is to make progress on the sentence, not perfect it.`,
`You might be putting pressure on yourself to get this right. But this is a working sentence, not a permanent promise about what your business must become.

Give yourself two minutes. Write the simplest version you can, even if the wording feels awkward.

You are allowed to change the sentence later. For now, give yourself something clear enough to work with.`],
val:[`You are looking for signs that people want something like your product.

Look for products similar to yours that people are buying, questions from people looking for a solution, or people asking for something your product could provide.

You are not trying to prove that your product will sell. You are looking for enough evidence to make a reasonable decision about whether to continue.`,
`Start where your potential buyer already looks for products or asks questions.

1. Search for products similar to yours.
2. Look for signs of demand, such as reviews, sales indicators where available, or people asking for that kind of solution.
3. Write down what you find and what it tells you.

You only need a few concrete examples to make your next decision. Set a time limit so this task doesn't turn into endless research.`,
`You don't need certainty. You need to decide what to do next based on what you have found.

Ask yourself:

* Have I found any credible signs that people want something like this?

If you have reasonable evidence, continue to creating your first version.

If you have found very little, don't automatically assume nobody wants it. Try one more focused way of checking demand before deciding.`,
`What is preventing you from checking whether people want your product?

* I don't know where to look: Start with one place where your potential buyers shop, search, or ask questions.
* I can't find similar products: Search using the problem your product solves, not just the name of your product.
* I can't tell whether people actually want it: Look for concrete signs, such as reviews, sales indicators, or people asking for a solution. Remember that a product existing doesn't automatically mean it sells.
* I can't access the information I need: Choose another place to look rather than spending all your time trying to access one source.

Choose the closest obstacle and take that next step.`,
`You don't need to research everything today.

Spend five minutes looking for one credible sign that people want something like your product.

Write down what you found and where you found it.

That's today's progress. You can continue your check later, but don't treat one example as proof that your product will sell.`,
`You don't need to know whether your product will succeed before you begin.

For the next five minutes, look for one real example of someone buying, searching for, or asking for something similar to what you want to make.

Write down what you find. Don't redesign your product, start a new idea, or open ten different research tabs.

Your job right now is simply to gather evidence and make a better-informed decision.`],
outline:[`Think about what your buyer should be able to do or achieve after using your product.

List the essential pieces your product needs to deliver that result.

Include what the buyer genuinely needs, not everything you could possibly add.`,
`Start with the result your product promises to help the buyer achieve.

1. Write down what the buyer needs to do to achieve that result.
2. Identify what your product must contain to help them do it.
3. List those pieces in the order the buyer will need them.

Aim for around five essential items to start. You can add more if the product genuinely needs them.`,
`When you're unsure whether something belongs in your product, ask yourself:

Would the buyer struggle to get the promised result without this?

If yes, include it.

If no, put it aside for later.

You don't need to add bonuses, extra pages, or additional features to make the product feel more valuable. Focus on delivering what you promised.`,
`Look at the result you want your product to deliver.

What would your buyer need that isn't on your list yet?

If you know what's missing, add it.

If you're unsure, look at your product promise again and work backwards from the result. Identify the essential information, tools, or components the buyer would need.

Don't start designing or creating the product yet. Finish the list first.`,
`You don't have to finish the entire list today.

Spend five minutes writing down the first three things your product needs to include.

Start with the essentials. You can finish and organise the list when you have more time.`,
`You might be making this task bigger than it needs to be.

You are not creating the product yet. You're simply deciding what needs to go into it.

Write down three essential items. Don't worry about the wording, design, or whether the list looks professional.

You can refine the list later. For now, give yourself a clear starting point.`],
make:[`Your first sellable version is the simplest complete version of your product that a buyer can actually use.

Use the list you made in the previous task. Create the essential parts needed to deliver the result you promised. Don't add extras or try to make it perfect. The goal is to have a product that is ready for someone to use.`,
`Start with the first item on your list and create it. Then move to the next one.

Keep going until you've created all the essential parts of your product. Use whatever tool you can already work with. You don't need to learn a new tool or find a better one before you begin.`,
`When you're unsure how to make something, choose the simplest approach that will let your buyer use it.

When you're unsure whether to include something, return to your list of essentials. If it isn't needed to deliver the promised result, leave it out for now.

Make the decisions needed to finish this version. You can improve it later.`,
`Identify what's actually stopping you from creating the product.

* Missing information: Find only the information you need to complete the part you're working on.

* A technical problem: Solve the specific problem blocking your progress rather than starting over.
* An unfinished earlier task: Return to that task and complete the missing part.

`You don't have to finish the entire product in one sitting.

Choose one essential part of your product and work on that alone. Before you stop, save your progress and note the next part you need to create.

The goal is to keep the product moving towards completion.`,
`Don't focus on finishing the whole product right now.

Open your work and spend five minutes creating one small part. It doesn't have to look polished yet. You can improve it once the essential content exists.

Start with the next item on your list and keep going.`],
ready:[`Check whether someone can use your product as intended.

Go through the product from the buyer's point of view. Look for missing information, broken elements, confusing instructions, or anything that prevents the buyer from getting the result you promised.

Fix problems that affect usability before worrying about small cosmetic details.`,
`Open your product and go through it as if you were using it for the first time.

`Identify the specific problem preventing you from checking the product.

`You don't have to check every detail today.

`You don't have to judge your entire product at once.

route:[`Choose a way for customers to pay for your product and receive it after purchase.

Choose one place you can access and use without needing to build a large audience first.

Make sure your message follows the rules of the platform or community you choose.`,
`Choose the route that makes it easiest to reach relevant people with the resources you have now.

Consider where your potential buyers are, whether you can access that place, and whether you can share your offer there appropriately.

Pick one route and commit to trying it. You can explore other routes later if needed.`,
`Identify what is preventing you from choosing a route or writing your message.

* You don't know where your buyers are: Return to what you know about your intended buyer and identify one place they are likely to look for help or products.
* You don't have an audience: Choose a relevant place where you can reach people beyond your own followers, if the rules allow it.
* You don't know what to say: Explain the problem your product helps with, what it offers, and where to find it.
* Your chosen platform doesn't allow promotion: Choose another suitable route rather than breaking its rules.

Solve the specific obstacle and continue.`,
`You don't need to plan a complete marketing strategy.

Spend five minutes choosing one realistic place to reach potential buyers and drafting a short message.

You can refine the message later. The goal is to prepare one practical way to get the offer in front of people.`,
`You don't have to promote your product on every platform or build a large following first.

Choose one place where your intended buyers might see your offer. Write a simple message explaining what the product does and where to find it.

Keep the task small enough to complete. You're preparing to show people what you've made, not committing to a complicated marketing plan.`],
send:[`Share your offer using the route you chose.

Publish your listing, post your message, or send it to the appropriate people, depending on your chosen method.

Make sure people can access the offer and understand how to buy it.

The goal is to give real potential buyers an opportunity to see what you're selling.`,
`Open the place where you decided to share your offer.

Use the message you prepared, include the correct purchase link or instructions, and publish or send it.

Before you finish, check that the message is visible to its intended audience and that the purchase link works.`,
`You have already chosen a route and prepared your message.

Use that decision rather than starting the planning process again.

Share the offer through the route you selected. You can evaluate the results after people have had a chance to see it.`,
`Identify the specific obstacle preventing you from sharing the offer.

* Your message isn't ready: Finish the missing information and use the clearest version you have.
* Your purchase link is missing or broken: Return to your selling setup and fix it.
* The platform won't let you post: Check the relevant requirements or use another suitable route.
* You're waiting for a particular resource: Determine whether it is essential to sharing the offer. If it isn't, proceed without it.

Address the obstacle that actually prevents you from putting the offer in front of people.`,
`You don't have to launch a full campaign.

If your offer and purchase process are ready, spend five minutes taking the next step to share it.

That might mean publishing the listing, posting your message, or sending it to an appropriate potential buyer.

If you cannot finish the whole action, prepare everything you need to complete it in your next work session.`,
`You've done the work of making a product and preparing an offer. The next step is to let potential buyers see it.

Choose the smallest appropriate action that gets the offer in front of someone.

Publish the post, share the listing, or send the message. Follow the rules of the place you're using.

You don't need to feel completely confident before taking this step.`],
obs:[`Look at what has happened since you put your offer in front of people.

Identify what you have actually observed. For example, people may not have seen the offer, they may have seen it without responding, they may have shown interest without buying, or someone may have purchased.

Use the evidence you have rather than guessing what people think.`,
`Check the information available to you.

Look at any views, replies, questions, clicks, conversations, or purchases you can access.

Write down what you know happened. If you don't have enough information to tell whether people saw the offer, say so.

You are identifying what happened so you can choose a sensible next step.`,
`Don't try to explain every possible reason behind the results.

First, identify the clearest thing you know:

* People haven't seen the offer.
* People have seen it but haven't responded.
* People have shown interest but haven't purchased.
* People have given feedback.
* Someone has purchased.
* You don't have enough information to tell.

Choose the description that best matches what you observed. You don't need to draw a bigger conclusion yet.`,
`What information do you need to understand what happened?

* You don't know whether people saw the offer: Check the available views, reach, or delivery information.
* You cannot tell whether people responded: Review the replies, comments, messages, or other responses you received.
* You cannot tell whether anyone purchased: Check your sales or order information.
* You have no useful information available: Record what you know and acknowledge what you cannot yet determine.

Use the information you can access. Don't invent an explanation for the results.`,
`You don't need to conduct a detailed analysis.

Spend five minutes checking what happened after you shared your offer.

Write down the clearest observation you can make. If you haven't had enough time to gather meaningful information, record that and review it later.`,
`You don't have to decide whether your product is a success or failure today.

Simply look at what happened after you shared it.

Record the most obvious observation without judging yourself or your product. The purpose is to choose your next action based on what you know, not on what you fear might be true.`],
unseen:[`Your next step is to get the offer in front of relevant people.

Return to the route you chose for reaching potential buyers. Make sure your offer is accessible and take the next action needed to share it.`,
`Open the platform or channel you chose.

Prepare your message, include the purchase link or instructions, and publish or send the offer in a way that reaches your intended audience.`,
`You have already chosen a route. Use that route for now instead of researching more options.

Take the next step to share your offer. You can consider another route after you have tried this one.`,
`Identify what is preventing you from sharing the offer.

Fix the specific issue with your message, link, access, or chosen platform. If the original route is not workable, choose another realistic way to reach potential buyers.`,
`Spend five minutes preparing the next step needed to share your offer.

If possible, complete the action. Otherwise, leave your message and link ready so you can finish quickly next time.`,
`Choose one small action that will make your offer visible to potential buyers.

Prepare the post, publish the listing, or send the message. Focus on sharing the offer rather than planning more ways to promote it.`],
ignored:[`You have put the offer in front of people, but you haven't received a response yet.

Check whether the message makes it clear what the product does, who it is for, and why someone might want it.

If the message is unclear, improve that specific part. If it is clear, consider whether you need to reach more relevant people before drawing conclusions.`,
`Read your offer as if you were seeing it for the first time.

Can you quickly understand what the product is, who it helps, and how to buy it?

If not, make the message clearer. If it already communicates those things, focus on reaching relevant potential buyers rather than repeatedly rewriting the same message.`,
`Don't assume that no response means nobody wants your product.

Check whether the offer is clear and whether the people who saw it are likely to be the right buyers.

Make one reasonable adjustment if needed. Otherwise, continue getting the offer in front of relevant people and observe what happens.`,
`Identify the most likely issue you can actually address.

* The offer is unclear: Improve the description.
* The intended buyer is not obvious: Make it clearer who the product is for.
* The purchase instructions are difficult to find: Make the next step easier to understand.
* You don't know whether the right people saw it: Try a more relevant audience or channel.

Address one issue at a time. Don't change everything without a clear reason.`,
`Spend five minutes reviewing your offer.

Identify one part that could be clearer and make that adjustment. If the message is already clear, prepare to share it with another relevant group of potential buyers.`,
`It can be uncomfortable to share something and receive no response.

But you don't need to decide what the silence means yet.

Review your message once, make one useful improvement if needed, and take the next reasonable step towards reaching potential buyers.`],
nobuy:[`Interest means someone has shown some level of curiosity, but it doesn't necessarily mean they are ready to buy.

Look at what interested people have said or asked. Identify whether they need clarification about the product, its contents, its price, or how to purchase it.

Use what you learn to address the actual concern rather than changing the whole product immediately.`,
`Review the questions or comments you received.

Look for anything that suggests uncertainty about what the product includes, what it helps with, its price, or how to buy it.

If someone has asked a question, respond clearly. If a common concern appears, make the relevant information easier to find in your offer.`,
`Don't immediately lower the price, add bonuses, or create a different product.

First, identify what you know about the people who showed interest.

If they expressed a specific concern, address it. If they simply showed interest without buying, make sure the offer and purchase process are clear and continue observing how people respond.`,
`Identify what may be preventing interested people from completing a purchase.

* They don't understand what they receive: Clarify the product contents.
* They don't understand the benefit: Make the intended result clearer without promising something the product cannot deliver.
* They have a question or concern: Respond to it honestly.
* The purchase process is confusing or broken: Check the purchase link and checkout process.
* You don't know why they haven't bought: Don't invent a reason. Look for more information through appropriate questions or further observations.

Address what you can establish rather than guessing.`,
`Spend five minutes reviewing the questions or responses you received.

Identify one concern or point of confusion you can address. Make that improvement or prepare a clear response.

You don't need to redesign the product today.`,
`You don't have to convince anyone to buy.

Look at what interested people have actually said. If someone has asked a question, answer it clearly. If your offer is missing important information, add it.

Then give potential buyers a clear opportunity to purchase without pressuring them.`],
told:[`Review the feedback and identify what the person is actually telling you.

Determine whether it points to a problem with the product, something that is unclear, a missing essential element, or simply a personal preference.

Use the feedback to decide whether a change is genuinely needed. You don't have to act on every suggestion.`,
`Read the feedback and identify the specific part of your product or offer it refers to.

If it identifies a clear problem, decide what change would address that problem. If the feedback is vague, seek clarification when appropriate.

Make the necessary adjustment and check that it improves the buyer's experience.`,
`Ask yourself whether the feedback reveals a problem that prevents the buyer from getting the promised result.

If it does, address it.

If it is a personal preference or an optional improvement, you can leave it for later.

Use feedback to make your product more useful, not to add every possible feature.`,
`Identify what you need to act on the feedback.

* The feedback is unclear: Ask what the person meant, if possible.
* You understand the problem but don't know the solution: Work on the smallest change that addresses it.
* The change requires a resource you don't have: Look for a practical alternative.
* The suggestion would make the product unnecessarily complicated: Consider whether it is essential to the result you promised.

Address the most important issue you can reasonably solve.`,
`Choose one piece of feedback that matters most to the buyer's ability to use the product.

Spend five minutes deciding how to address it or making a small improvement.

You can work on optional changes later.`,
`Feedback doesn't mean you have failed. It gives you information about how someone experiences your product.

Choose one useful point from the feedback and decide what to do about it.

You don't have to rebuild everything. Make the change that matters most, if a change is genuinely needed.`],
unknown:[`You don't yet have enough information to understand how people are responding to your offer.

Your next step is to gather a little more useful information. Check whether people are seeing the offer, whether they are responding, and whether anyone is trying to purchase.

Don't make a major decision based on information you don't have.`,
`Start with the information available to you.

Check the views or reach provided by your platform, review any replies or messages, and look at your sales information.

If those details aren't available, record what you can observe and choose a practical way to get the offer in front of relevant people again.`,
`You don't have to decide whether your product is working yet.

Identify what you still need to know. Then take one action that could provide that information, such as sharing the offer with a relevant audience or checking the available activity data.

Make your next decision when you have something more concrete to work with.`,
`Identify which information you cannot access.

* You cannot see whether people viewed the offer: Check the platform's available activity information.
* You cannot tell whether anyone responded: Review the places where you shared it.
* You cannot confirm purchases: Check your sales or order records.
* No useful information is available: Choose a practical way to reach relevant people and observe the response.

Work with what you can establish. Don't assume that no information means no interest.`,
`Spend five minutes checking whatever information is available.

Write down what you know and what remains unknown. If you cannot determine the result yet, make a note to review it after you have more information.`,
`You don't need to decide whether your product is succeeding or failing right now.

Simply check what information you have. Write down what happened and what you still don't know.

Your next step is to gather useful information, not to judge yourself.`],
sale:[`A sale means someone has paid for your product.

Your immediate priority is to make sure the buyer receives what they purchased and can access it as intended.

After that, note what helped the buyer find or purchase the product. You can use what you learn to decide what to do next.`,
`Check that the purchase is recorded and that the buyer has received the product or the correct delivery instructions.

If delivery is automatic, verify that the process worked as expected. If delivery is manual, complete it promptly.

Once the buyer has access, record the sale and note how the buyer found your offer if you know.`,
`Don't feel pressured to create a new product or expand your business immediately.

First, make sure the buyer receives what they paid for.

Then decide whether your next step is to continue sharing the current offer, improve something based on the experience, or gather feedback when appropriate.

You can keep working with the product you already have.`,
`Identify what still needs attention after the sale.

* The buyer hasn't received the product: Check the delivery process and resolve the issue.
* The buyer cannot access the product: Provide the correct access instructions or fix the delivery problem.
* You don't know how the buyer found you: Record the sale and ask about the source when appropriate.
* You don't know what to do next: Make sure the transaction and delivery are complete, then continue with your existing offer.

Resolve any issue affecting the buyer first.`,
`Prioritise anything the buyer needs, especially product delivery or access.

Once that is handled, spend a few minutes recording the sale and noting anything useful you learned.

You don't need to plan your entire next business stage today.`,
`You have made a sale. Now focus on looking after the buyer.

Confirm that they have what they paid for and resolve any access issues. You don't have to make a big decision about the future of your business right now.

Complete the immediate responsibility, then choose your next step.`]};
